name: pr-outputs-workflow-call-reusable

on:
  workflow_call:
    inputs:
      pr-head-ref:
        required: true
        type: string
      pr-head-sha:
        required: true
        type: string
      pr-number:
        required: true
        type: number
    outputs:
      pr-checks-clear:
        description: 'pr-checks-clear output from action-context in workflow_call mode'
        value: ${{ jobs.validate.outputs.pr-checks-clear }}
      pr-conventional-commits:
        description: 'pr-conventional-commits output from action-context in workflow_call mode'
        value: ${{ jobs.validate.outputs.pr-conventional-commits }}
      pr-last-commit-age-minute:
        description: 'pr-last-commit-age-minute output from action-context in workflow_call mode'
        value: ${{ jobs.validate.outputs.pr-last-commit-age-minute }}
      pr-merge-state-clear:
        description: 'pr-merge-state-clear output from action-context in workflow_call mode'
        value: ${{ jobs.validate.outputs.pr-merge-state-clear }}
      pr-number:
        description: 'pr-number output from action-context in workflow_call mode'
        value: ${{ jobs.validate.outputs.pr-number }}

permissions:
  checks: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      pr-checks-clear: ${{ steps.context.outputs.pr-checks-clear }}
      pr-conventional-commits: ${{ steps.context.outputs.pr-conventional-commits }}
      pr-last-commit-age-minute: ${{ steps.context.outputs.pr-last-commit-age-minute }}
      pr-merge-state-clear: ${{ steps.context.outputs.pr-merge-state-clear }}
      pr-number: ${{ steps.context.outputs.pr-number }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.pr-head-ref }}

      - name: validate checkout parity for branch-based versioning
        run: |
          set -euo pipefail
          actual_ref="$(git rev-parse --abbrev-ref HEAD)"
          [[ "${actual_ref}" == "${{ inputs.pr-head-ref }}" ]] || {
            echo "::error::Expected checkout on '${{ inputs.pr-head-ref }}' but got '${actual_ref}'."
            exit 1
          }

          actual_sha="$(git rev-parse HEAD)"
          [[ "${actual_sha}" == "${{ inputs.pr-head-sha }}" ]] || {
            echo "::error::Expected HEAD '${{ inputs.pr-head-sha }}' but got '${actual_sha}'."
            exit 1
          }

      - name: run action in explicit pr mode
        id: context
        uses: ./
        with:
          context-source: pr
          pr-head-ref: ${{ inputs.pr-head-ref }}
          pr-head-sha: ${{ inputs.pr-head-sha }}
          pr-number: ${{ inputs.pr-number }}
          token: ${{ github.token }}
          trusted-bots: |
            renovate[bot]
            dependabot[bot]

      - name: validate reusable workflow outputs
        run: |
          [[ "${{ steps.context.outputs.pr-number }}" == "${{ inputs.pr-number }}" ]] || { echo "::error::pr-number mismatch in workflow_call mode"; exit 1; }
          [[ "${{ steps.context.outputs.pr-head-ref }}" == "${{ inputs.pr-head-ref }}" ]] || { echo "::error::pr-head-ref mismatch in workflow_call mode"; exit 1; }
          [[ "${{ steps.context.outputs.pr-checks-clear }}" =~ ^(true|false)$ ]] || { echo "::error::pr-checks-clear should be boolean"; exit 1; }
          [[ "${{ steps.context.outputs.pr-conventional-commits }}" =~ ^(all|title-only|commits-only|none)$ ]] || { echo "::error::pr-conventional-commits should be one of all, title-only, commits-only, none"; exit 1; }
          [[ "${{ steps.context.outputs.pr-merge-state-clear }}" =~ ^(true|false)$ ]] || { echo "::error::pr-merge-state-clear should be boolean"; exit 1; }
          [[ "${{ steps.context.outputs.pr-last-commit-age-minute }}" =~ ^[0-9]+$ ]] || { echo "::error::pr-last-commit-age-minute should be non-negative integer"; exit 1; }
