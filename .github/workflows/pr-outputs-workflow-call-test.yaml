name: pr-outputs-workflow-call-test

on:
  pull_request:
    branches:
      - trunk

permissions: {}

jobs:
  call-reusable-pr-outputs:
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    uses: ./.github/workflows/pr-outputs-workflow-call-reusable.yaml
    with:
      pr-head-ref: ${{ github.event.pull_request.head.ref }}
      pr-head-sha: ${{ github.event.pull_request.head.sha }}
      pr-number: ${{ github.event.pull_request.number }}

  validate-caller-visible-outputs:
    needs:
      - call-reusable-pr-outputs
    runs-on: ubuntu-latest
    steps:
      - name: validate workflow_call outputs surfaced to caller
        run: |
          [[ "${{ needs.call-reusable-pr-outputs.outputs.pr-number }}" == "${{ github.event.pull_request.number }}" ]] || { echo "::error::caller-visible pr-number mismatch"; exit 1; }
          [[ "${{ needs.call-reusable-pr-outputs.outputs.pr-checks-clear }}" =~ ^(true|false)$ ]] || { echo "::error::caller-visible pr-checks-clear should be boolean"; exit 1; }
          [[ "${{ needs.call-reusable-pr-outputs.outputs.pr-conventional-commits }}" =~ ^(all|title-only|commits-only|none)$ ]] || { echo "::error::caller-visible pr-conventional-commits should be one of all, title-only, commits-only, none"; exit 1; }
          [[ "${{ needs.call-reusable-pr-outputs.outputs.pr-merge-state-clear }}" =~ ^(true|false)$ ]] || { echo "::error::caller-visible pr-merge-state-clear should be boolean"; exit 1; }
          [[ "${{ needs.call-reusable-pr-outputs.outputs.pr-last-commit-age-minute }}" =~ ^[0-9]+$ ]] || { echo "::error::caller-visible pr-last-commit-age-minute should be non-negative integer"; exit 1; }

      - name: summary
        run: |
          echo "## workflow_call PR outputs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| pr-number | ${{ needs.call-reusable-pr-outputs.outputs.pr-number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pr-checks-clear | ${{ needs.call-reusable-pr-outputs.outputs.pr-checks-clear }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pr-conventional-commits | ${{ needs.call-reusable-pr-outputs.outputs.pr-conventional-commits }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pr-merge-state-clear | ${{ needs.call-reusable-pr-outputs.outputs.pr-merge-state-clear }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pr-last-commit-age-minute | ${{ needs.call-reusable-pr-outputs.outputs.pr-last-commit-age-minute }} |" >> $GITHUB_STEP_SUMMARY
