author: 'escapace'
description: 'Derive semantic versioning, environment classification, and build metadata from git history and repository configuration.'
inputs:
  node-version:
    description: 'Node.js version constraint. Pooled with package.json engines and workspace constraints; the highest minimum version wins.'
    required: false
  token:
    default: ${{ github.token }}
    description: 'GitHub API token for changelog generation and GitHub Pages detection.'
    required: false
name: 'action-context'
outputs:
  changelog:
    description: 'Markdown changelog generated from conventional commits between the previous tag and the current ref. Non-empty on tag events only.'
  environment:
    description: 'Deployment environment: "production" for release tags, "staging" for prerelease tags, "testing" for branch events.'
  github-pages:
    description: 'Whether GitHub Pages is enabled with workflow-based builds.'
  github-pages-path:
    description: 'Relative path to static assets directory. Set when exactly one workspace package defines a build:github-pages script.'
  latest:
    description: 'Whether the current version is greater than or equal to the highest existing semver tag.'
  node-version:
    description: 'Resolved Node.js version from the action input, package.json engines, or workspace packages.'
  prerelease:
    description: 'Whether the version contains prerelease identifiers.'
  prerelease-identifier:
    description: 'First prerelease identifier from the version string (for example, "rc" from 1.2.0-rc.1). Empty for release versions.'
  short-commit:
    description: 'Abbreviated commit SHA (7 characters, extended past leading zeros).'
  version:
    description: 'Computed semantic version derived from git tags and conventional commits.'
runs:
  main: 'lib/action/lib/node/index.js'
  using: 'node24'
