author: 'escapace'
description: 'Derive semantic versioning, environment classification, and build metadata from git history and repository configuration.'
inputs:
  node-version:
    description: 'Node.js version constraint. Pooled with package.json engines and workspace constraints; the highest minimum version wins.'
    required: false
  token:
    default: ${{ github.token }}
    description: 'GitHub API token for changelog generation, GitHub Pages detection, and pull request data.'
    required: false
  trusted-bots:
    default: ''
    description: 'Newline-separated list of bot logins trusted as commit authors (e.g., renovate[bot]). Matching is case-insensitive. Empty means no bots are trusted.'
    required: false
name: 'action-context'
outputs:
  changelog:
    description: 'Markdown changelog generated from conventional commits between the previous tag and the current ref. Non-empty on tag events only.'
  environment:
    description: 'Deployment environment: "production" for release tags, "staging" for prerelease tags, "testing" for branch events.'
  github-pages:
    description: 'Whether GitHub Pages is enabled with workflow-based builds.'
  github-pages-path:
    description: 'Relative path to static assets directory. Set when exactly one workspace package defines a build:github-pages script.'
  latest:
    description: 'Whether the current version is greater than or equal to the highest existing semver tag.'
  node-version:
    description: 'Resolved Node.js version from the action input, package.json engines, or workspace packages.'
  pr-author-bot:
    description: 'Whether the PR author is a bot account. False on non-PR events.'
  pr-base-ref:
    description: 'PR base branch name. Empty on non-PR events.'
  pr-checks-clear:
    description: 'Whether all status checks are passing. False on non-PR events.'
  pr-commits-trusted:
    description: 'Whether every commit author is trusted (bot in trusted-bots allowlist with verified signature, or human with verified signature and write permission). False on non-PR events.'
  pr-head-ref:
    description: 'PR head branch name. Empty on non-PR events.'
  pr-mergeable:
    description: 'Whether the PR has no merge conflicts (does not check if branch is behind base). False on non-PR events.'
  pr-not-draft:
    description: 'Whether the PR is not a draft. False on non-PR events.'
  pr-number:
    description: 'PR number. 0 on non-PR events.'
  pr-review-clear:
    description: 'Whether reviews do not block merging (no changes requested, no unsatisfied review requirements, no pending review requests). False on non-PR events.'
  prerelease:
    description: 'Whether the version contains prerelease identifiers.'
  prerelease-identifier:
    description: 'First prerelease identifier from the version string (for example, "rc" from 1.2.0-rc.1). Empty for release versions.'
  short-commit:
    description: 'Abbreviated commit SHA (7 characters, extended past leading zeros).'
  version:
    description: 'Computed semantic version derived from git tags and conventional commits.'
runs:
  main: 'lib/action/lib/node/index.js'
  using: 'node24'
